ời xem cao tuổi; tuyển tập này được ưa chuộng hơn các video khác."}],"se":{"tich_cuc":93,"trung_tinh":5,"tieu_cuc":2},"bh":["Trang phục thiết kế độc đáo cộng nhạc gốc là hai trụ cột thu hút nhất; hãy đầu tư đồng đều vào cả hai và làm rõ từng bộ trang phục (nhiều khán giả muốn may/mặc thật).","Khán giả cao tuổi muốn nhận ra mình trong nội dung: video khiến họ nhảy ngay tại bếp, ghế TV, phòng tắm. Thiết kế nội dung để gợi 'nhảy theo' và kể chuyện cá nhân sẽ tạo bình luận chất lượng.","Trả lời mọi bình luận bằng đúng ngôn ngữ của người xem tạo cảm giác cộng đồng thân thiết rất mạnh với khán giả lớn tuổi quốc tế; nhưng nên đa dạng hóa câu trả lời để không bị cảm giác mẫu máy móc.","Với bộ sưu tập, kiểm tra khung hình (tránh cắt đầu/chân vũ công) và cân nhắc cung cấp bản đầy đủ; khán giả chú ý cả lỗi AI nhưng sẵn lòng bỏ qua nếu cảm xúc tốt.","Định vị AI như 'công cụ như cọ vẽ' và nhấn mạnh thông điệp niềm vui/tôn vinh tuổi già giúp chuyển hóa cả người vốn ghét AI hoặc ghét siêu thực.","Gắn mốc thời gian/tên chương trong tuyển tập (như Gathering Thunder 3:19) giúp khán giả chỉ ra phần yêu thích và dẫn dắt sang video gốc, tăng thời gian xem."],"cx":["Niềm vui, hân hoan, muốn nhảy","Biết ơn và cảm động","Hoài niệm tuổi trẻ, cảm giác được tiếp thêm sức sống","Ngưỡng mộ, kinh ngạc về thiết kế và màu sắc","Lạc quan, tự hào về tuổi già","Một chút hoài nghi/mâu thuẫn về AI nhưng bị thuyết phục bởi cảm xúc"]}},{"ch":"ruby","id":"pqjzVRo0xEc","title":"🏆 Call Me a Classic • I Saved It for Today | We’re Still Dancing 4K","date":"2026-10-05","dur":525,"views":260327,"likes":5038,"cmts":406,"fetched":406,"series":"Fashion Dance","short":false,"day":101,"an":{"tq":"Video 'Call Me a Classic • I Saved It for Today' (260K view, 406 bình luận) là video hot nhất trong nhóm. Bình luận cực kỳ tích cực, đầy tính cảm xúc và cộng đồng: nhiều người 60-81 tuổi kể đã đứng dậy nhảy theo, ước được mua trang phục, chia sẻ câu chuyện cá nhân (nghỉ hưu, góa bụa, sống ở vùng quê bảo thủ, từng là vũ công). Chủ đề 'đừng để dành đồ đẹp cho lúc sau' gây đồng cảm sâu. Có tranh luận về AI (khen lẫn phản đối nhẹ), phê bình về thân hình quá gầy/trẻ, thiếu người to con. Tiếng Anh chiếm ưu thế, cùng Nga, Pháp, Đức, Séc, Tây Ban Nha, Ý, Hà Lan... Chủ kênh trả lời hầu hết, kể cả đa ngôn ngữ.","kg":"Chủ yếu nữ và nam 60-81 tuổi: 81 (một người xem, một người xem - từng dạy khiêu vũ 10 năm), 80 (Chantal tập Qi Gong, một người xem là cựu vũ công, cụt chân), 79, 78, 74 (Đức, Mỹ), 72 (một người xem ở Florida, góa chồng 20 năm), 71 (một người xem), 70, 69, 65 (@PaulCozad y tá hưu 45 năm, một người xem sống ở vùng quê bảo thủ), 'bà từ Siberia', Guyana, Úc, Mexico (50 tuổi), Moscow. Một cựu nhà tạo mẫu Pháp. Nhiều người có lối sống đơn độc, mắc vấn đề sức khỏe/di chuyển nhưng vẫn yêu nhảy.","yt":[{"diem":"Trang phục độc đáo, màu sắc, bảng phối màu; thèm mặc/mua","bang_chung":"'Imagine if a designer used some of these ideas for a Fashion Show, we’d all buy them!' (85 like); 'I want to buy them all! 71 yr. Old'; 'These beautiful designs put the so-called fashion industry to shame 10x over'","muc_do":"cao"},{"diem":"Niềm vui, năng lượng khiến họ đứng dậy nhảy theo","bang_chung":"'I am 81 and you got me out of my chair... even attempted a jump!!' (51 like); 'I got out of my chair too!'","muc_do":"cao"},{"diem":"Thông điệp tôn vinh tuổi già, 'còn thuốc súng trong kho', 'Old is gold'","bang_chung":"'We have a lot of life in us' (một người xem, 27 like); 'We old folks have seen some sh*t... all the stronger, freer' (một người xem); 'Old is gold!'","muc_do":"cao"},{"diem":"Âm nhạc, lời bài hát và ý tưởng 'Call me a Classic'","bang_chung":"'the idea of Elderlies being called Classic, its great!!!! the lyrics are actually quite neat' (một người xem)","muc_do":"trung bình"},{"diem":"Trang phục kín đáo nhưng quyến rũ, thay thế thời trang hở hang","bang_chung":"'these clothing designs have brought back modesty that still allows sex appeal' (một người xem); 'Way better than the stuff seen at today's fashion shows'","muc_do":"trung bình"},{"diem":"Bối cảnh, thoát ly thực tại (escapism)","bang_chung":"'9 минут чистого эскейпа' (một người xem); 'Его нереальность добрее реальности'","muc_do":"trung bình"}],"gc":[{"diem":"Xem lặp lại/xem như thói quen hàng ngày, tập thể dục","bang_chung":"'Je la regarde en boucle et elle donne du peps pour toute ma journée' (một người xem); 'Chaque jour, je termine ma série d'exercices en dansant... j'ai 80 ans' (một người xem); 'I know I’ll watch it many times over'"},{"diem":"Khán giả đến từ video khác và theo dõi cả kênh","bang_chung":"'This is the second one I've seen' (một người xem); 'This is my second video I'm watching' (@DesireeBurton); 'I just prescribed. October 2026' (@PaulCozad, đăng ký kênh); 'Subbed and hyped'"},{"diem":"Chia sẻ trải nghiệm và kết nối cộng đồng: khán giả tương tác với nhau","bang_chung":"Chuỗi 'I got out of my chair too / Respect on that jump / I also did a little shakin the tail feather'"},{"diem":"Nhận ra mình trong thông điệp 'để dành đồ đẹp'","bang_chung":"'Yes I did that... being on a tight budget... I had skirts that were too special unless for an occasion' (một người xem); 'I live alone since my husband died... I should start dressing for myself' (một người xem)"},{"diem":"Nghiện/không rời mắt được","bang_chung":"'Super addictif' (một người xem); 'очень залипательно. Не оторваться'; 'I can't get enough'"}],"yc":[{"diem":"Muốn mua trang phục/link mua sắm/nhà thiết kế thật làm show thời trang","bang_chung":"'Where in the heck can I buy the clothes' (một người xem); 'Came to the comments hoping for a shopping link' (một người xem); 'Жалко, что купить нельзя' (một người xem, 12 like). Chủ kênh: trang phục chỉ là thiết kế số, không bán"},{"diem":"Muốn nghe/mua nhạc, danh sách phát, tên bài hát","bang_chung":"'Where can I buy the songs?' (một người xem); 'What is the song?' (một người xem); 'publish a music CD... PLEASE!!' (một người xem). Chủ kênh dẫn tới rubyaiart.net"},{"diem":"Muốn đa dạng dáng người: người to con, bụng bia, plus size, không chỉ mảnh/cao","bang_chung":"'would you mind mixing in more people of all sizes? Even older men like me with a belly like to dance' (một người xem); 'I wish it had included some plus size people' (một người xem); 'You have to be tall to wear any of these' (một người xem)"},{"diem":"Muốn tổ chức buổi hòa nhạc/show thời trang thật trên sàn catwalk, chiếu cho viện dưỡng lão","bang_chung":"'CONCERT BE ORGANIZED LIVE... TOUR THE FASHION CAPITALS' (một người xem); 'Too bad this isn't real. It would be great to show folks in retirement facilities' (một người xem)"},{"diem":"Muốn biết địa điểm quay / nơi này ở đâu","bang_chung":"'What cities were used for this video's filming' (một người xem); 'I want to where they are!' (một người xem)"}],"cp":[{"diem":"Tranh luận về AI. Một bên bảo vệ: AI là công cụ, nghệ sĩ là người sáng tạo","bang_chung":"'AI is a fabulous tool. AI isn't the creator. An artist decided to generate this... It democratizes art.' (một người xem); 'Brilliant use of AI! I can see the humans behind' (một người xem); 'I appreciate the honesty about this... let's keep on top of this amazing tool' (một người xem)"},{"diem":"Phản đối AI: nguy hiểm cho xã hội, ảo giác; con người sẽ thành lịch sử","bang_chung":"'Nejsem příznivcem AI. Žít ve svých iluzích nepřinese nic dobrého' (một người xem); 'Люди станут историей в роликах ИИ' (một người xem)"},{"diem":"Chê vũ đạo AI 'lame', chuyển động như người say","bang_chung":"'AI dance moves are incredibly lame' (một người xem); 'Движения, как у пьяных! А костюмы кайф' (một người xem); 'rhythm is very fast' (một người xem, nhịp quá nhanh)"},{"diem":"Nghi ngờ 'người cao tuổi' không thật: thân hình quá trẻ/thể thao; người mẫu chưa đẹp","bang_chung":"'No es creíble es gente joven con cabello blanco' (một người xem); 'But why not really beautiful models?!' (một người xem); 'most of these dancers are soo slim' (@JudyFord)"},{"diem":"Tiếc vì không có thật; muốn thấy người thật","bang_chung":"'Pity, it is not real!' (một người xem); 'Too bad this isn't real'"},{"diem":"Câu hỏi giọng hát có phải AI; có người trả lời thẳng 'It’s AI'. Không thấy bình luận nào so sánh với kênh Surreal AI","bang_chung":"'Who is this singing?' / 'It’s AI.' (một người xem); 'Is the singer Adele?' (@سليمةعطية)"}],"tt":"Phản hồi hầu hết bình luận (kể cả emoji), nhiều ngôn ngữ (Anh, Nga, Pháp, Đức, Tây Ban Nha, Bồ, Séc, Ý, Hà Lan, Hàn, Ả Rập, Ukraina, Latvia...). Có hai giọng: 'we' ngắn gọn, trang trọng cho phần lớn, và 'I' dài hơn, cá nhân hơn cho bình luận sâu (chúc mừng sinh nhật 74, đồng cảm với người góa, hứa 'đưa nhiều dáng người hơn'). Trả lời trung thực về trang phục chỉ là thiết kế số, nhạc gốc, dẫn tới rubyaiart.net. Về AI: nhấn mạnh công cụ + sự chỉ đạo của con người, thừa nhận 'còn phải cải thiện chuyển động', thừa nhận 'không phải lúc nào cũng thực tế'. Hiệu quả cao: tạo cộng đồng, khuyến khích khán giả kể chuyện. Hạn chế: văn mẫu lặp lại, trả lời khá né tránh về plus size/độ thật.","bl":[{"tac_gia":"Người xem","likes":85,"goc":"Imagine if a designer used some of these ideas for a Fashion Show, we’d all buy them! ❤","vi":"Hãy tưởng tượng nếu một nhà thiết kế dùng ý tưởng này cho show thời trang, tất cả chúng ta sẽ mua!","vi_sao":"Nhiều like nhất; sinh ra chuỗi trả lời về thời trang, mặc đẹp, mua sắm."},{"tac_gia":"Người xem","likes":51,"goc":"I am 81 and you got me out of my chair in an attempt at movement. I did some steps... I even attempted a jump!! ... More, please! This is the second one I've seen","vi":"Tôi 81 tuổi và bạn đã khiến tôi rời ghế để vận động. Tôi nhảy vài bước, thậm chí thử nhảy lên!! ... Làm thêm đi! Đây là video thứ hai tôi xem","vi_sao":"Bằng chứng mạnh nhất về giữ chân: kích thích vận động, tạo chuỗi người khác nhảy theo."},{"tac_gia":"Người xem","likes":46,"goc":"Tremendous! If that doesn't make you smile or make you want to move, nothing will! I know I’ll watch it many times over!","vi":"Tuyệt vời! Nếu cái này không làm bạn cười hay muốn nhúc nhích thì không gì làm được! Tôi sẽ xem nhiều lần","vi_sao":"Xem lặp lại, hiệu ứng vận động."}],"se":{"tich_cuc":88,"trung_tinh":7,"tieu_cuc":5},"bh":["Chủ đề 'đừng để dành đồ đẹp cho sau này' và 'Call me a Classic' tạo đồng cảm sâu, khiến khán giả kể câu chuyện riêng; hãy chọn thông điệp đời thường, dễ nhận ra mình.","Nhạc nhịp đều, vui, có thể nhảy ngồi tại ghế biến video thành bài tập hàng ngày; khuyến khích 'cử động theo khả năng'.","Trang phục rực rỡ, kín đáo-quyến rũ là điểm hút chính, nhưng sinh ra nhu cầu mua; cân nhắc bán mẫu/phiên bản thật hoặc hướng dẫn tự may (nhiều người nhắc máy may).","Đa dạng dáng người, chiều cao, tuổi thật hơn để giảm phản biện 'không thật/quá gầy' và để người xem thấy mình.","Chuẩn bị câu trả lời minh bạch về AI (công cụ + con người), vì cuộc tranh luận AI xuất hiện đều đặn nhưng khán giả lớn tuổi thường ủng hộ nếu thấy sự chăm chút.","Phản hồi đa ngôn ngữ cho mọi bình luận giúp biến người xem một lần thành cộng đồng quay lại."],"cx":["Niềm vui, phấn khích","Hy vọng và được truyền cảm hứng","Hoài niệm, nhớ nhung (người chồng đã mất, quá khứ nhảy múa)","Tự hào về tuổi tác","Thèm muốn/ao ước (được mặc, được ở trong thế giới ấy)","Biết ơn","Một chút tiếc nuối vì 'đáng tiếc không có thật'"]}},{"ch":"ruby","id":"1fGqs2vjsV0","title":"🏆 Life Is Still Calling • Ageless Fashion Dance | Surreal Music Video 4K","date":"2026-10-13","dur":481,"views":44669,"likes":1036,"cmts":65,"fetched":65,"series":"Fashion Dance","short":false,"day":109,"an":{"tq":"Video 'Life Is Still Calling' (44K view, 65 bình luận, nhạc 'Wake The Room' và 'Still Going Somewhere', tập trung nhiều vào đàn ông cao tuổi). Không khí tích cực, ấm, ít bình luận hơn nhưng sâu: người 71 tuổi kể cách hai chị em dùng video để nhảy 15-30 phút mỗi ngày qua điện thoại; người 70 tuổi sống 'chế độ sinh tồn' nay muốn tự do nhảy; cựu vũ công 80 tuổi bị cụt chân thấy nhớ nhung. Có vài phản biện về AI (tiếc không phải người thật, giọng hát 'như thiếu niên', 'tôi ước AI đừng làm nhạc hay đến vậy') và một người không thích.","kg":"Người lớn tuổi nói tiếng Anh nhiều hơn: sinh 1955 (71, một người xem, cùng chị gái), sinh 1953 (một người xem), 75 tuổi (một người xem), 80 tuổi Pháp (một người xem, tập Qi Gong/Tai chi), 80 tuổi từng là vũ công hiện đại, cụt chân (một người xem), người ở Columbus Ohio, Brazil, Nga/Ukraina, Tây Ban Nha. Cũng có người có nền âm nhạc/đạo diễn (@koshka2025 vẽ, học nhạc).","yt":[{"diem":"Nhạc vui, nhịp đều không dồn dập, lời dễ nghe; bài 'Wake the Room'","bang_chung":"'The beat is steady and not frantic. The mood is joyous.' (một người xem); 'fabulous music, especially Wake the Room' (một người xem); 'I love the music and the energetic and enthusiastic dancers with their happy faces!' (một người xem)","muc_do":"cao"},{"diem":"Vũ công tràn năng lượng, như tuổi tác chỉ là tin đồn","bang_chung":"'those dancers move like age is just a rumor' (một người xem, 11 like)","muc_do":"cao"},{"diem":"Thông điệp 'cuộc sống vẫn gọi', tuổi vàng, sống tiếp, đi tiếp","bang_chung":"'It filled me with a sense of appreciation and gratitude for my golden years' (một người xem); 'Not done living... the horizon is still out there. Go get it.' (một người xem)","muc_do":"cao"},{"diem":"Bối cảnh, nội thất, trang phục độc đáo","bang_chung":"'los escenarios, el mobiliario, el vestuario, espectaculares!' (một người xem)","muc_do":"trung bình"},{"diem":"Dùng AI để tạo thế giới mới thay vì bắt chước thực tế","bang_chung":"'тот случай, когда ИИ используют не для похожести с реальностью, а для создания новой реальности' (một người xem)","muc_do":"thấp"},{"diem":"Video tập trung vào đàn ông được yêu thích bất ngờ","bang_chung":"'At first I thought I wouldn't like it as much because it was focused on men but I LOVED it.' (một người xem)","muc_do":"thấp"}],"gc":[{"diem":"Dùng làm bài tập nhảy hàng ngày, xây playlist tự động phát","bang_chung":"'we generally try to dance for 15 to 30 minutes and call each other when we are done. We are building playlists so chung":"(không có)"}],"tt":"Chủ kênh trả lời gần như mọi bình luận, ngôn ngữ phù hợp (Anh, Nga, Tây Ban Nha, Pháp), giọng ngôi thứ nhất 'I' ấm áp, dài với người chia sẻ cá nhân (an ủi người 1953, đồng cảm với cựu vũ công 80 tuổi bị cụt chân, nhắc 'Who needs the splits when you've got the spirit!'). Trả lời trung thực: 'dancers are digitally created characters', 'outfits are original digital designs, not available to buy', giọng trẻ 'do have a youthful sound'. Hiệu quả: gần gũi, hài hước nhẹ. Hạn chế: không dẫn link nhạc/playlist cho khán giả dù họ tự xây playlist.","bl":[{"tac_gia":"Người xem","likes":11,"goc":"Wake the room is right, those dancers move like age is just a rumor and I am completely here for it, darlings 💃","vi":"'Wake the room' đúng thật, các vũ công di chuyển như tuổi tác chỉ là tin đồn và tôi hoàn toàn ủng hộ, các cưng","vi_sao":"Nhiều like nhất, nhắc tên bài hát và ý chính."},{"tac_gia":"Người xem","likes":9,"goc":"I was born in 1955. My sister and I do dancercize type videos... Excercises for older people even when it's billed as dance style are boring... These videos are fantastic. There is no need to follow the moves... The beat is steady and not frantic. The mood is joyous. We generally try to dance for 15 to 30 minutes and call each other when we are done.","vi":"Tôi sinh năm 1955. Chị em tôi tập video kiểu dancercize... Bài tập cho người già thường nhàm chán... Những video này tuyệt vời. Không cần theo bước... Nhịp đều, không dồn dập, tâm trạng vui. Chúng tôi nhảy 15-30 phút rồi gọi nhau","vi_sao":"Phân tích khán giả chi tiết nhất: nhu cầu, cách dùng, lý do giữ chân; so sánh với video tập thể dục khác."},{"tac_gia":"Người xem","likes":7,"goc":"Was born in1953. Lived my life in survival mode. Now I am free. Want to dance, improvise. I have good sense of rhythm","vi":"Sinh năm 1953. Sống cả đời trong chế độ sinh tồn. Giờ tôi tự do. Muốn nhảy, ứng tác. Tôi có cảm giác nhịp điệu tốt","vi_sao":"Cho thấy khát khao tự do, hoàn cảnh sống; chủ kênh trả lời dài ấm áp."}],"se":{"tich_cuc":88,"trung_tinh":8,"tieu_cuc":4},"bh":["Nhạc có nhịp đều, không dồn dập và tâm trạng vui hợp người cao tuổi nhảy tại chỗ; giữ lối này và nêu tên bài trong tiêu đề/mô tả để khán giả nhắc lại.","Video có thể hoạt động như bài tập thể dục: khán giả tạo playlist, nhảy 15-30 phút; hãy cung cấp playlist chính thức, video dài/liên tục.","Chỗ nào có người xem sống 'sinh tồn', cô đơn hay từng là vũ công, hãy trả lời sâu; họ là khán giả trung thành nhất.","Mở rộng nhân vật (cả đàn ông) vẫn được đón nhận; đa dạng chủ thể giúp mở rộng tệp.","Giọng hát nghe trẻ và 'AI thiếu niên' bị góp ý; cân nhắc giọng trưởng thành hơn để hợp chủ đề tuổi tác."],"cx":["Vui tươi, tràn năng lượng","Biết ơn, trân trọng 'tuổi vàng'","Hoài niệm và tiếc nuối (cựu vũ công, bị cụt chân)","Khát khao tự do (người sống 'chế độ sinh tồn')","Hào hứng cho người 75 'young'","Một chút buồn vì 'không phải người thật'"]}},{"ch":"ruby","id":"VYAGTgJNp2c","title":"Scenic AI Music Video | “Still in Season” – For Couples Still Dancing After 50 Years | 4K","date":"2026-10-26","dur":553,"views":56010,"likes":464,"cmts":26,"fetched":26,"series":"Scenic Journey","short":false,"day":122,"an":{"tq":"Video 'Still in Season' (cặp đôi trên 70 tuổi nhảy múa, cảnh nước Mỹ) có 56 nghìn lượt xem và 26 bình luận, vừa mới đây (trong vòng vài ngày), rất nồng nhiệt, nhiều chia sẻ về tuổi và cảm xúc 'vừa nhảy vừa khóc'. Có góp ý muốn mở rộng ra thế giới ngoài nước Mỹ. Một bình luận tiếng Nga lạc đề (có vẻ đăng nhầm video).","kg":"Phụ nữ trung niên và cao tuổi tự nói tuổi: 61 và 56 tuổi, có người có chồng ('husband'). Người nói tiếng Tây Ban Nha (QUIQUE, miriammejia), Pháp (denpeco, MichelCOLLINET, GeorgetaPavel), Nga/Ukraine (Сергей, một người xem), Nam Phi (magdaleenjacobs), Đức/Áo (birgitgunia). Một số khán giả là người Pháp ngữ lớn tuổi.","yt":[{"diem":"Chủ đề 'vẫn còn trong mùa' - ngợi ca người lớn tuổi vẫn nhảy, vẫn yêu, vẫn sống; khán giả đồng cảm cá nhân","bang_chung":"It resonates with my :"Что это за счёт перед вет клиникой ???"}],"tt":"Chủ kênh trả lời tất cả 13/13 bình luận, đa ngôn ngữ (Anh, Tây Ban Nha, Pháp, Nga). Phản hồi cá nhân, dài, kích thích ('at 56, you are absolutely still in season... Keep dancing'), dùng lại thông điệp video để động viên người xem. Chấp nhận góp ý mở rộng văn hóa ('la tendré muy presente'). Xử lý khéo bình luận lạc đề, tôn trọng cảm xúc. Rất hiệu quả cho tương tác, gắn kết cảm xúc.","bl":[{"tac_gia":"Người xem","likes":3,"goc":"Thank you again for this beautiful music, film and text,.....being 61 years old it really resonates with me and makes me dance and cry at the same time, so beautiful !!!! THANKS","vi":"Cảm ơn lần nữa vì âm nhạc, phim và lời văn tuyệt đẹp... ở tuổi 61 nó thực sự cộng hưởng với tôi, khiến tôi vừa nhảy vừa khóc, thật đẹp!","vi_sao":"Nhiều like nhất; nêu tuổi, cảm xúc cốt lõi, đồng thời cho thấy người xem quay lại ('again') và đọc cả phần văn mô tả."},{"tac_gia":"Người xem","likes":1,"goc":"Es la primera producción musical con IA que concretamente: ¡ ES BRILLANTE !. Por favor, si van a mantener este nivel, produzcan muchas más!!! Y no hace falta que siempre se relacione con EEUU. Tienen el mundo entero...","vi":"Đây là sản phẩm âm nhạc AI đầu tiên mà thực sự xuất sắc! Nếu giữ được mức này xin hãy làm thật nhiều. Và không cần luôn liên quan đến Mỹ; cả thế giới đang chờ để lấy cảm hứng.","vi_sao":"Lời khen cao nhất về chất lượng AI kèm yêu cầu cụ thể về đa dạng văn hóa."},{"tac_gia":"Người xem","likes":0,"goc":"It resonates with my 56 y.o. soul that I want to dance and cry at the same time. But cry out of joy and believe that I am still in season.","vi":"Nó cộng hưởng với tâm hồn 56 tuổi của tôi: muốn nhảy và khóc cùng lúc. Nhưng khóc vì niềm vui và tin rằng mình vẫn đang 'trong mùa'.","vi_sao":"Chứng tỏ thông điệp tên bài hát được đón nhận."}],"se":{"tich_cuc":88,"trung_tinh":12,"tieu_cuc":0},"bh":["Thông điệp cụ thể về tuổi ('still in season') khiến khán giả 56-61 tuổi tự nhận mình; đặt tên bài/tiêu đề có câu khẳng định tuổi tác tích cực.","Phần mô tả kể câu chuyện (cuộc gọi 'don't wait up') có tác dụng: khán giả nhắc 'music, film and text'; nên đầu tư viết mô tả cảm xúc.","Video này đạt 56K lượt xem, vượt xa các video khác; công thức cặp đôi trên 70 tuổi + cảnh Mỹ + hai bài hát nhịp vui hiệu quả.","Một khán giả muốn bối cảnh ngoài Mỹ: có thể thử các nền văn hóa khác để mở thị trường khán giả quốc tế.","Trả lời tất cả bình luận bằng đúng ngôn ngữ và dùng lại thông điệp video để động viên đã tạo cộng đồng gắn bó; duy trì."],"cx":["Xúc động, vừa vui vừa khóc","Tự hào, được tiếp thêm sức sống","Hạnh phúc, sôi nổi","Biết ơn","Tình yêu"]}},{"ch":"ruby","id":"bzpi2VtCR-w","title":"Sweetest In The Fall – Seniors Dance With Giant Pumpkins | Surreal Fashion Dance Video (4K)","date":"2026-10-30","dur":501,"views":417180,"likes":5834,"cmts":375,"fetched":375,"series":"Fashion Dance","short":false,"day":126,"an":{"tq":"Video Fashion Dance chủ đề bí ngô mùa thu (4K, 417K lượt xem, 5,8K like, 375 bình luận). Không khí cực kỳ ấm áp, biết ơn và vui sướng: phần lớn là lời khen ngắn kiểu 'Beautiful', 'Pure JOY', kèm nhiều câu chuyện cá nhân xúc động về tuổi già, bệnh tật, khiêu vũ. Điểm khác biệt so với nhiều video AI khác là rất nhiều người tự nhận 'vốn không thích AI' nhưng vẫn khen video này. Chủ kênh trả lời gần như mọi bình luận bằng đa ngôn ngữ, tạo cảm giác một cộng đồng thân thiện. Bình luận chê chiếm tỉ lệ rất nhỏ, chủ yếu xoay quanh việc 'là AI, không phải người thật'. Không có bình luận nào so sánh với kênh Surreal AI hay nói về sao chép.","kg":"Chủ yếu phụ nữ lớn tuổi, nhiều người tự nêu tuổi: 65+, 67, 68, 69, 70, 72, 75, 81, 85. Có người sống một mình và nhảy quanh nhà mỗi ngày (một người xem, 72 tuổi), người nông dân cho gia súc ăn sáng (một người xem), người ngồi xe lăn/ốm yếu không còn nhảy được (một người xem, một người xem 85 tuổi), người làm trang sức (một người xem), người nhảy ở trung tâm người cao tuổi. Rất đa quốc gia, ngôn ngữ: Anh/Mỹ (Nam California, Deep South), New Zealand, Ba Lan (Warsaw), Nga, Ukraina, Bulgaria, Đức, Pháp, Bỉ, Hà Lan, Séc, Tây Ban Nha, Chile, Brazil, Iran, Trung Quốc/Đài Loan. Nhóm nói tiếng Nga chiếm số lượng lớn các bình luận ngắn. Có cả khán giả trẻ hơn (50+, 60+) mong muốn được sống tự do hơn khi về già.","yt":[{"diem":"Người cao tuổi được tôn vinh: mặc đẹp, nhảy tự do, thông điệp 'già không có nghĩa là dừng lại' và ước mong ngoài đời người già cũng được như vậy","bang_chung":"\"Although this is AI, feel that all elderly people should dress like this in real life.\" (110 like); \"I forgot that slowing down does not mean stopping.\"; \"Лучшей старости и не пожелать!\"","muc_do":"cao"},{"diem":"Trang phục haute couture sặc sỡ, chất liệu, họa tiết; nhiều người muốn mặc hoặc mua, may theo","bang_chung":"\"I want every single pumpkin and all those dresses.\"; \"you should produce the clothes\"; \"Костюмы лучше, чем у именитых кутюрье.\"; \"ich träume davon mir auch solche Kleider zu nähen\"","muc_do":"cao"},{"diem":"Niềm vui, năng lượng, nụ cười của các vũ công; cảm giác hạnh phúc và tích cực lan tỏa","bang_chung":"\"One of my most favorite things is their smiles. I am 70 and this is my inspiration.\"; \"Эти видосики так заряжают позитивом\"; \"diese Videos schütten absolute Glückshormone aus\"","muc_do":"cao"},{"diem":"Âm nhạc bắt tai, nhịp điệu khiến người ta muốn nhảy; giọng hát được khen","bang_chung":"\"Wer kann da still sitzen bleiben? Der Rhythmus reißt einen mit.\"; \"Тембърът на певицата и кристалният звук!!\"; \"Who sings? Is this your voice? This music feeds the soul.\"","muc_do":"cao"},{"diem":"Bối cảnh bí ngô mùa thu, các chi tiết bất ngờ (bí ngô thành đài phun nước, váy hạt bí, váy patchwork), sự hài hòa màu sắc","bang_chung":"\"the pumpkin at 5:54 shooting out a jet of water ... was a woooww\"; \"платье из тыквенных семечек\"; \"Fell in love with the patchwork dress at 0:49\"","muc_do":"trung bình"},{"diem":"Chi tiết chân trần và chuyển động nhẹ nhàng, tinh tế, tự nhiên (khớp với tên bài 'Shoes Off, Heart On')","bang_chung":"\"Love it they are barefooted\"; \"Excellent, and bare feet!\"; \"Ich finde die kleinen, sehr feinen Bewegungen am schönsten.\"","muc_do":"trung bình"},{"diem":"Chất lượng nghệ thuật AI được xem là tử tế, có 'ý tưởng và tâm huyết', là cách dùng AI đúng đắn","bang_chung":"\"THIS is what AI needs to always be about. Creativity, Inspiration, pure JOY\"; \"This is what AI was meant to do!\"; \"The most dynamic AI art online.\"","muc_do":"trung bình"}],"gc":[{"diem":"Xem lại nhiều lần, hẹn xem mỗi ngày","bang_chung":"\"mesmerized watching this video...5 times!\"; \"Watch this 10 times.\"; \"буду смотреть его каждый день\"; \"Bomba, stále na tom jedu\"; \"I shall return to it many more times.\""},{"diem":"Nhảy theo, tập luyện tại nhà; video khơi dậy thói quen vận động (chân trần, nhạc buổi sáng)","bang_chung":"\"I tried dancing with them & like it. Believe I will start to help strengthen core, legs\"; \"play music next morning while making coffee and be bare foot dance\"; \"Muito bom ... até dancei junto\""},{"diem":"Nhận ra mình trong video và cảm thấy được đồng cảm (người ốm, người già cô đơn, người thấy bị xã hội gò bó)","bang_chung":"\"I see myself in all the dances.\"; \"I'm 85 and illness has taken my balance... I want it back.\"; \"I live alone and dance around my house everyday\""},{"diem":"Là kênh yêu thích, quay lại xem các phim khác và chờ video mới","bang_chung":"\"Ruby Ai Art, you are by far my most favourite creator!\"; \"Please make more videos.\"; \"Очередное бомбическое видео!\""},{"diem":"Cộng đồng bình luận thân thiện, người xem trả lời nhau và được chủ kênh hồi đáp tận tình","bang_chung":"\"now I have found a whole group of new friends to dance with!\"; \"Thanks you for letting my music be part of your morning\" (phản hồi của chủ kênh)"},{"diem":"Truyền cảm hứng sáng tạo cho người làm nghề thủ công/thời trang","bang_chung":"\"I make jewellery and these colours and textures have given me so many ideas\""}],"yc":[{"diem":"Sản xuất/bán/may trang phục trong video ngoài đời thật","bang_chung":"\"you should produce the clothes\"; \"Ich würde gerne das eine oder andere erwerben\"; \"I want all the clothes!\"; \"Who makes the outfits!?\""},{"diem":"Làm thêm video, tiếp tục kênh","bang_chung":"\"The most dynamic AI art online. Please make more videos.\"; \"Keep it going guys.\""},{"diem":"Muốn được tham gia vào dự án / có phiên bản người thật","bang_chung":"\"Gostaria de participar desse trabalho\"; \"I kinda wish they were real seniors dancing!\"; \"would have been an awesome fun photoshoot ... if it was real\""},{"diem":"Muốn người ngoài đời mặc đẹp và nhảy như vậy, thậm chí lập câu lạc bộ cho người già","bang_chung":"\"Хочу чтобы так одевались все люди тогда у нас будет МИР ВО ВСЁМ МИРЕ\"; \"chętnie bym chodziła do jakiegoś klubu dla staruszków\""},{"diem":"Hỏi về giọng hát/nhạc","bang_chung":"\"Who sings? Is this your voice?\""}],"cp":[{"diem":"Không thích nội dung AI nói chung, tiếc vì không phải người thật; một số thấy 'giả', 'không hấp dẫn'","bang_chung":"\"Не знаю, но мне почему то не интересно смотреть такие творения ИИ... Хотелось бы настоящего\"; \"При всей яркости ... есть что-то отталкивающее. Фальшь.\"; \"Pity it was AI\"; \"Жаль что это ИИ.\""},{"diem":"Chê âm nhạc AI nhàm chán","bang_chung":"\"AI Boring music yet again. I'm getting sick of hearing it.\" (1 like, bình luận tiêu cực rõ nhất)"},{"diem":"Nhắc nhở người khác rằng đây là AI, không phải người thật","bang_chung":"\"This is artificial intelligence. Not real people...-\"; \"Made with AI.... From now on, you should always scroll down\""},{"diem":"Tranh luận chuẩn mực xã hội về tuổi già: không phải ai cũng muốn ăn mặc cầu kỳ, và đừng đòi người già phải ăn mặc để được nhìn khác đi","bang_chung":"\"If you need me to dress up so you can view me differently, so be it... your view of me does not define who i am\" (một người xem); \"Dance like them- yes! Dress like them???? Some outfits I like, some????\""},{"diem":"Thực tế khắt khe với người già: không phải ai cũng đi lại, nhảy được, hoặc xã hội không cho phép","bang_chung":"\"Nam starym, już nie wolno... wolno nam tylko zajmować się wnukami\"; \"Если бы всем было так легко двигаться\"; \"If only this was completely real... I am trying not to lose me, but it's hard\""},{"diem":"Có người nghi ngờ đây là AI hoặc nói không thấy người già, hoặc bình luận về ngoại hình nhân vật","bang_chung":"\"I don't believe this is AI.\"; \"Прекрасные, молодые (где вы увидели пожилых?)\"; \"Абсолютно некрасивые, но такие живые и настоящие\""},{"diem":"Không có bình luận so sánh với kênh Surreal AI, nhắc 'kênh gốc' hay nói về sao chép/giống giọng, nhạc, trang phục kênh khác trong video này","bang_chung":"(không tìm thấy trong 375 bình luận)"}],"tt":"Chủ kênh (Ruby) trả lời gần như mọi bình luận, kể cả bình luận một chữ, thường dài 3-6 câu, giọng cực kỳ ấm áp, nhiều emoji trái tim/hoa tulip/ôm. Trả lời bằng đúng ngôn ngữ của người xem (Anh, Nga, Pháp, Đức, Tây Ban Nha, Bồ Đào Nha, Séc, Bulgaria, Ukraina, Hà Lan, Ba Tư, Trung...). Nhắc lại chi tiết người xem nêu (váy patchwork thành áo khoác, bí ngô phun nước 5:54, váy hạt bí) nên tạo cảm giác được lắng nghe thật sự. Với người bệnh/buồn (85 tuổi, 81 tuổi sau phẫu thuật, người mất sức) trả lời đồng cảm, 'gửi cái ôm'. Thẳng thắn thừa nhận nhân vật, trang phục là sản phẩm số khi được hỏi, xác nhận giọng hát là giọng số, nhạc do mình tạo; không tranh cãi với người chê AI mà đón nhận lịch sự. Một số bình luận chê ('AI Boring music', 'Фальшь', 'не интересно') không được trả lời. Hiệu quả cao: nhiều người cảm ơn, quay lại xem nhiều lần, cảm thấy kết nối cá nhân; nhưng lối trả lời hơi rập khuôn và dùng chung một mẫu cảm ơn.","bl":[{"tac_gia":"Người xem","likes":110,"goc":"Although this is AI, feel that all elderly people should dress like this in real life. How differently they would view themselves and how differently they would be viewed by others. Beautiful video.","vi":"Dù đây là AI, tôi nghĩ tất cả người cao tuổi nên ăn mặc như vậy ngoài đời. Họ sẽ nhìn chính mình và được người khác nhìn khác đi biết bao. Video đẹp.","vi_sao":"Nhiều like nhất, nêu đúng thông điệp cốt lõi mà khán giả yêu thích và châm ngòi cuộc thảo luận về chuẩn mực tuổi già."},{"tac_gia":"Người xem","likes":79,"goc":"This is altogether fabulous. And one of my most favorite things is their smiles. I am 70 and this is my inspiration. Music and video 10 out of 10. And yes I know this is AI. Someone still had to think to do it.","vi":"Thật tuyệt vời. Một trong những điều tôi thích nhất là nụ cười của họ. Tôi 70 tuổi và đây là nguồn cảm hứng của tôi. Nhạc và video 10/10. Tôi biết đây là AI, nhưng vẫn phải có người nghĩ ra nó.","vi_sao":"Người xem 70 tuổi chấp nhận AI vì công sức sáng tạo của con người, khen cả nhạc lẫn hình."},{"tac_gia":"Người xem","likes":55,"goc":"I absolutely LOVE this video. Dance has been a large part of my life. I want it back. I'm 85 and illness has taken my balance and my energy. I want it back.","vi":"Tôi cực kỳ yêu video này. Khiêu vũ từng là một phần lớn cuộc đời tôi. Tôi muốn lấy lại nó. Tôi 85 tuổi và bệnh tật đã lấy mất thăng bằng và sức lực của tôi.","vi_sao":"Cho thấy video chạm vào nỗi nhớ, nhiều người đồng cảm (8 like cho trả lời) và chủ kênh phản hồi xúc động."}],"se":{"tich_cuc":90,"trung_tinh":7,"tieu_cuc":3},"bh":["Thông điệp 'người cao tuổi xứng đáng được tỏa sáng, tự do, nhảy múa' là động lực cảm xúc mạnh nhất; khán giả tự kể câu chuyện đời mình, nên hãy gắn video với một ý nghĩa nhân văn chứ không chỉ đẹp mắt.","Trang phục sáng tạo là thứ khơi gợi mong muốn cụ thể (mặc, may, mua); có thể khai thác bằng cảnh cận từng bộ, mốc thời gian để người xem nhắc, hoặc sản phẩm thật.","Chủ đề theo mùa (bí ngô, Halloween/thu) và chi tiết bất ngờ (bí ngô phun nước, váy hạt bí) tạo điểm chạm để khán giả trích mốc thời gian và bàn luận.","Trả lời từng bình luận bằng đúng ngôn ngữ của người xem, nhắc lại chi tiết họ nói, tạo cộng đồng trung thành; nhưng nên đa dạng mẫu câu để tránh rập khuôn.","Thành thật về AI (nói rõ nhân vật, trang phục, giọng hát là kỹ thuật số) giúp hóa giải hoài nghi; nhiều người ghét AI vẫn khen nếu nội dung tích cực, có chất lượng và có 'tâm'.","Chuẩn bị cho nhóm yêu cầu 'muốn người thật' và áp lực ăn mặc: nhấn mạnh cảm hứng nhảy theo, chân trần, thoải mái, không áp đặt phải ăn mặc cầu kỳ; cần đổi mới âm nhạc để tránh bị chê 'AI nhàm chán'."],"cx":["Niềm vui, hạnh phúc, phấn khích","Biết ơn chủ kênh","Xúc động, hoài niệm về những ngày còn nhảy được","Ngưỡng mộ trước vẻ đẹp thị giác","Khao khát được già đi một cách tự do và rực rỡ","Tiếc nuối vì cảnh không có thật (nhóm nhỏ)","Hoài nghi nhẹ về AI nhưng bị thuyết phục"]}},{"ch":"chloe","id":"aXX_vbtx9MY","title":"Wild Looks Good on You | Original Music Video 4K","date":"2026-09-19","dur":44,"views":349,"likes":11,"cmts":8,"fetched":8,"series":"Fashion / Dance (other)","short":true,"day":4,"an":{"tq":"Video rất nhỏ (349 lượt xem, 8 bình luận) nhưng không khí ấm áp, thân tình. Gần như toàn bộ bình luận đến từ một fan trung thành là một người xem, kèm một icon trái tim của một người xem. Chủ kênh trả lời đủ cả 3 thread, giọng dịu dàng, như trò chuyện với người quen.","kg":"một người xem là người xem lặp lại, có vẻ lớn tuổi, nói tiếng Anh pha cách dùng từ Đức (Genial, absolut), từng tự nói ở video khác là sống ở Úc. một người xem chỉ thả tim, không rõ thông tin. Chưa có dấu hiệu rõ về tuổi hay nghề nghiệp ngoài Lola.","yt":[{"diem":"Bài hát gốc là lý do chính khiến Lola quay lại","bang_chung":"I looked for this song, but still can’t find it! So I watch the video over and over again","muc_do":"cao"},{"diem":"Thiết kế trang phục có chi tiết ẩn (bộ đồ cá đuối manta) được khám phá khi chuyển động","bang_chung":"I finally found out that the title costume is a MANTA RAY! I saw it when the wings were swinging. Genial!","muc_do":"cao"},{"diem":"Bản dài (long version) có phần được yêu thích riêng","bang_chung":"That’s my absolut favourite part from the long version","   return `<div class="hb">`+items.map(i=>`<div class="lab" title="${esc(i.l)}">${i.dot||''}${esc(i.l)}</div><div class="tr" title="${esc(i.tip||'')}"><div class="fi" style="width:${Math.max(.8,i.v/mx*100)}%;--cc:${i.c||'var(--accent)'}"></div><span class="va">${i.t!=null?i.t:fmtv(i.v)}</span></div>`).join('')+`</div>`;
}
function miniCompare(title, sub, key, fmtv, note){
  return `<div class="mini"><h4>${title}</h4><p class="note">${sub}</p>${hbars(CHS.map(k=>({l:NAME[k],v:M(k)[key],c:COL(k),dot:dotI(k)+' '})),{fmtv})}${note?`<p class="note" style="margin:8px 0 0">${note}</p>`:''}</div>`;
}

/* ---------- biểu đồ chấm: lượt xem từng video theo ngày kể từ khi lập kênh (thang log) ---------- */
function dotPlot(){
  const host = $('#dotplot'); if(!host) return;
  const all = state.range==='all';
  const pts = V.filter(v=>!v.short && v.views>0 && (all || v.day<=53));
  const W=900,H=380,L=64,R=14,T=12,B=34, iw=W-L-R, ih=H-T-B;
  const xmax = all ? Math.ceil(Math.max(...pts.map(p=>p.day))/30)*30 : 56;
  const lo=Math.log10(50), hi=Math.log10(2e6);
  const X = d => L + d/xmax*iw, Y = v => T + ih - (Math.log10(v)-lo)/(hi-lo)*ih;
  let s = `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lượt xem từng video dài của ba kênh theo ngày kể từ khi lập kênh, thang logarit">`;
  const TL={100:'100',1000:'1 k',1e4:'10 k',1e5:'100 k',1e6:'1 triệu'};
  [100,1000,1e4,1e5,1e6].forEach(t=>{ s+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${TL[t]}</text>`; });
  const step = all ? 60 : 7;
  for(let d=0; d<=xmax; d+=step){ s+=`<line class="ax" x1="${X(d)}" x2="${X(d)}" y1="${T+ih}" y2="${T+ih+4}"/><text x="${X(d)}" y="${H-14}" text-anchor="middle">${d}</text>`; }
  s+=`<text x="${L+iw/2}" y="${H-1}" text-anchor="middle">Số ngày kể từ khi lập kênh</text>`;
  s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  const shape = (k,x,y,r) => k==='surreal' ? `<circle cx="${x}" cy="${y}" r="${r}"/>` : k==='ruby' ? `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" rx="1.5"/>` : `<polygon points="${x},${y-r*1.3} ${x+r*1.3},${y} ${x},${y+r*1.3} ${x-r*1.3},${y}"/>`;
  ['surreal','ruby','chloe'].forEach(k=>{
    s+=`<g fill="${COL(k)}" stroke="var(--surface)" stroke-width="2" fill-opacity=".92">`+pts.filter(p=>p.ch===k).map(p=>shape(k,X(p.day),Y(p.views),k==='chloe'?6:5)).join('')+`</g>`;
  });
  s+=`</svg><div class="tip" id="tip"></div>`;
  host.innerHTML = s;
  const svg = host.querySelector('svg'), tip = $('#tip');
  const P = pts.map(p=>({p,x:X(p.day),y:Y(p.views)}));
  svg.onmousemove = e=>{
    const r = svg.getBoundingClientRect(), sx = W/r.width, mx=(e.clientX-r.left)*sx, my=(e.clientY-r.top)*sx;
    let best=null, bd=18*18;
    P.forEach(q=>{const d=(q.x-mx)**2+(q.y-my)**2; if(d<bd){bd=d;best=q;}});
    if(!best){tip.style.display='none'; svg.style.cursor='default'; return;}
    const p=best.p; svg.style.cursor='pointer';
    tip.innerHTML = `<b>${dotI(p.ch)} ${NAME[p.ch]}</b><br>${esc(p.title)}<br><span class="note">Ngày ${p.day} · ${dateVi(p.date)}</span><br><b>${fmt(p.views)}</b> lượt xem<br><span class="note">Bấm để xem phân tích video</span>`;
    tip.style.display='block';
    const hr = host.getBoundingClientRect();
    let left = (e.clientX-hr.left)+14; if(left+280>hr.width) left = (e.clientX-hr.left)-290;
    tip.style.left = Math.max(0,left)+'px'; tip.style.top = Math.max(0,(e.clientY-hr.top)-20)+'px';
  };
  svg.onmouseleave = ()=>{tip.style.display='none'};
  svg.onclick = e=>{
    const r = svg.getBoundingClientRect(), sx = W/r.width, mx=(e.clientX-r.left)*sx, my=(e.clientY-r.top)*sx;
    let best=null, bd=18*18; P.forEach(q=>{const d=(q.x-mx)**2+(q.y-my)**2; if(d<bd){bd=d;best=q;}});
    if(best) openVideo(best.p.id);
  };
  const rows = pts.slice().sort((a,b)=>a.day-b.day).map(p=>`<tr><td>${dotI(p.ch)} ${NAME[p.ch]}</td><td class="num">${p.day}</td><td>${esc(p.title)}</td><td class="num">${fmt(p.views)}</td></tr>`).join('');
  $('#dottable').innerHTML = `<table><thead><tr><th>Kênh</th><th class="num">Ngày</th><th>Video</th><th class="num">Lượt xem</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function first53Text(){
  const g=k=>V.filter(v=>v.ch===k&&!v.short&&v.day<=53).map(v=>v.views).sort((a,b)=>a-b);
  const a=g('surreal'), b=g('ruby'), c=g('chloe');
  return `Trong 53 ngày đầu, video dài kém nhất của Surreal vẫn được ${fmt(a[0])} lượt xem và của Ruby ${fmt(b[0])}; Surreal có ${a.filter(x=>x>=1e4).length}/${a.length} video vượt 10.000, Ruby ${b.filter(x=>x>=1e4).length}/${b.length}. Chloe có ${c.filter(x=>x>=1e4).length} video vượt 10.000 nhưng ${c.filter(x=>x<1000).length}/${c.length} video dưới 1.000 lượt xem, từ lúc kênh đổi chủ đề.`;
}

function metricsTable(){
  let h = `<div class="tscroll"><table><thead><tr><th>Chỉ số</th>${CHS.map(k=>`<th class="num">${dotI(k)} ${NAME[k]}</th>`).join('')}</tr></thead><tbody>`;
  ROWS.forEach(r=>{
    if(r[1]===null && r[2]===undefined){ h+=`<tr><td colspan="4" style="background:var(--surface-2);font-weight:600;font-size:12.5px">${r[0]}</td></tr>`; return; }
    const vals = CHS.map(k=>{ const m=M(k); return r[1]? m[r[1]] : null; });
    let best = -1;
    if(r[3]==='high'){ best = vals.indexOf(Math.max(...vals)); }
    h+=`<tr><td>${r[0]}</td>`+CHS.map((k,i)=>{ const m=M(k); const t = r[1] ? (r[2].length===1 && r[2]===fmt ? fmt(m[r[1]]) : r[2](r[1]==='x'?m:m[r[1]])) : r[2](m); return `<td class="num ${i===best?'best':''}">${t}</td>`; }).join('')+`</tr>`;
  });
  return h+`</tbody></table></div><p class="note">Ô tô nền xanh là kênh cao nhất ở chỉ số đó (chỉ tô khi "cao hơn là tốt hơn"). Số bình luận và số người bình luận chỉ gồm bình luận lấy được từ YouTube ngày 07/11/2026.</p>`;
}
function themesCompare(){
  const names = []; CHS.forEach(k=>D.channels[k].themes.forEach(t=>{ if(!names.includes(t.theme)) names.push(t.theme); }));
  const pct = (k,n)=>{ const t=D.channels[k].themes.find(x=>x.theme===n); return t?t.pct:0; };
  names.sort((a,b)=>Math.max(...CHS.map(k=>pct(k,b)))-Math.max(...CHS.map(k=>pct(k,a))));
  return names.slice(0,9).map(n=>`<div class="theme"><div class="tn">${esc(n)}</div>${hbars(CHS.map(k=>({l:NAME[k],v:pct(k,n),c:COL(k),t:dec(pct(k,n),1)+'%',dot:dotI(k)+' '})),{max:30})}</div>`).join('');
}
function seriesMix(k){
  const tot = D.channels[k].series.reduce((a,s)=>a+s.views,0);
  const ss = D.channels[k].series;
  const shown = ss.slice(0,4), rest = ss.slice(4);
  const segs = shown.map((s,i)=>({n:s.name,c:s.n,p:s.views/tot*100,o:1-i*.17}));
  if(rest.length){ const rv=rest.reduce((a,s)=>a+s.views,0); segs.push({n:'Các dòng khác',c:rest.reduce((a,s)=>a+s.n,0),p:rv/tot*100,o:.35}); }
  return `<div style="margin:12px 0"><b>${dotI(k)} ${NAME[k]}</b> <span class="note">${ss.length} dòng nội dung, ${V.filter(v=>v.ch===k).length} video</span><div class="stack" style="--cc:${COL(k)}">${segs.map(s=>`<div style="flex:${Math.max(s.p,1.5)};opacity:${s.o}" title="${esc(s.n)}: ${s.c} video, ${dec(s.p,1)}% lượt xem">${s.p>=9?esc(s.n)+' '+Math.round(s.p)+'%':''}</div>`).join('')}</div><span class="note">${segs.map(s=>`${esc(s.n)}: ${s.c} video, ${dec(s.p,0)}%`).join(' · ')}</span></div>`;
}

function sentBar(se){ const a=se.tich_cuc||0,b=se.trung_tinh||0,c=se.tieu_cuc||0; return `<div class="sent" title="Tích cực ${a}% · trung tính ${b}% · tiêu cực ${c}%"><div style="width:${a}%;background:var(--good)"></div><div style="width:${b}%;background:var(--line-2)"></div><div style="width:${c}%;background:var(--bad)"></div></div><span class="note">Tích cực ${a}% · trung tính ${b}% · tiêu cực ${c}%</span>`; }
function listBlock(title, arr, fallback){
  if(!arr || !arr.length) return fallback?`<h4>${title}</h4><p class="note">${fallback}</p>`:'';
  return `<h4>${title}</h4><ul class="clean">${arr.map(i=>`<li><b>${esc(i.diem||i)}</b>${i.bang_chung?`<br><span class="note">${esc(i.bang_chung)}</span>`:''}</li>`).join('')}</ul>`;
}
function detail(v){
  const a=v.an, rep = D.channels[v.ch].report+'#v-'+v.id;
  let h = '';
  if(v.studio){ const s=v.studio; h+=`<div class="callout warn" style="margin-top:10px"><b>Studio 28 ngày:</b> ${fmt(s.imp)} hiển thị · CTR ${dec(s.ctr,1)}% · xem TB ${s.avd}% độ dài · ${s.subs} đăng ký mới (${dec(s.spk,1)} / 1.000 lượt xem)</div>`; }
  if(!a) return h+'<p class="note">Chưa có phân tích cho video này.</p>';
  h+=`<p style="margin-top:10px"><b>Tóm tắt:</b> ${esc(a.tq)}</p><p class="note"><b>Khán giả:</b> ${esc(a.kg)}</p>${sentBar(a.se)}`;
  h+=`<div class="two"><div>${listBlock('Khán giả yêu thích',a.yt,'Chưa có điểm yêu thích rõ ràng.')}${listBlock('Điều giữ chân họ',a.gc)}</div><div>${listBlock('Khán giả yêu cầu',a.yc,'Không có yêu cầu nào.')}${listBlock('Phê bình, chưa hài lòng',a.cp,'Không có phê bình nào.')}</div></div>`;
  if(a.tt) h+=`<h4>Chủ kênh tương tác</h4><p>${esc(a.tt)}</p>`;
  if(a.bh && a.bh.length) h+=`<h4>Bài học</h4><ul class="clean">${a.bh.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(a.bl && a.bl.length) h+=`<h4>Bình luận tiêu biểu</h4>`+a.bl.map(q=>`<div class="quote"><div class="vi">${esc(q.vi)}</div><div class="og">${esc(q.goc)}</div><div class="note">${esc(q.tac_gia)} · ${q.likes} like${q.vi_sao?' · '+esc(q.vi_sao):''}</div></div>`).join('');
  h+=`<p class="note">Dựa trên ${v.fetched} bình luận lấy được từ YouTube.</p>`;
  return h;
}
function filtered(){
  const f=state.filter; let vs=V.filter(v=>f.ch.has(v.ch) && (!f.series||v.series===f.series) && (f.type==='all'||(f.type==='short')===v.short));
  if(f.q){ const q=f.q.toLowerCase(); vs=vs.filter(v=>v.title.toLowerCase().includes(q)||v.id.toLowerCase()===q||(v.an&&v.an.tq.toLowerCase().includes(q))); }
  const S={views:(a,b)=>b.views-a.views, date:(a,b)=>b.date.localeCompare(a.date), like:(a,b)=>(b.views?b.likes/b.views:0)-(a.views?a.likes/a.views:0), cmt:(a,b)=>(b.cmts/Math.max(b.views,1))-(a.cmts/Math.max(a.views,1))};
  return vs.sort(S[f.sort]);
}

/* ---------- Điều hướng ---------- */
const TABS=[['compare','So sánh 3 kênh'],['surreal','Surreal AI'],['ruby','Ruby Ai Art'],['chloe','Chloe AI Art'],['videos','Tất cả video'],['plan','Kết luận']];
function go(t){
  state.tab=t; try{ history.replaceState(null,'','#'+t); }catch(e){}
  $('#tabs').innerHTML = TABS.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${k===t}" onclick="go('${k}')">${CHS.includes(k)?dotI(k):''}${l}</button>`).join('');
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  if(t==='compare') renderCompare(); else if(CHS.includes(t)) renderChannel(t); else if(t==='videos') renderVideos(); else if(t==='plan') renderPlan();
  window.scrollTo(0,0);
}


const h=(location.hash||'').slice(1); go(TABS.some(t=>t[0]===h)?h:'compare');
